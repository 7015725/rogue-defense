name: RC Soak

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: rc-soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@1.62.1
          npx playwright install --with-deps chromium
      - name: Accelerated long-run and Stress300 baseline
        id: soak
        shell: bash
        run: |
          set +e
          npm run soak 2>&1 | tee soak.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          PERF_LINE=$(grep 'RC_PERF ' soak.log | tail -n 1 | sed 's/^.*RC_PERF //' | tr -d '\r\n' | cut -c1-180)
          if [ -n "$PERF_LINE" ]; then echo "perf_line=$PERF_LINE" >> "$GITHUB_OUTPUT"; fi
          if [ "$EXIT_CODE" -ne 0 ]; then
            TEST_LINE=$(grep -E '^[[:space:]]*[0-9]+\)' soak.log | head -n 1 | tr -d '\r\n' | cut -c1-150)
            DETAIL_LINE=$(grep -E 'Error:|Expected:|Received:|Timeout|Autoplay run ended|toBeGreaterThan' soak.log | head -n 1 | tr -d '\r\n' | cut -c1-150)
            if [ -n "$TEST_LINE" ] && [ -n "$DETAIL_LINE" ]; then ERROR_LINE="$TEST_LINE :: $DETAIL_LINE";
            elif [ -n "$TEST_LINE" ]; then ERROR_LINE="$TEST_LINE";
            elif [ -n "$DETAIL_LINE" ]; then ERROR_LINE="$DETAIL_LINE";
            else ERROR_LINE=$(tail -n 3 soak.log | tr '\n' ' ' | tr -d '\r' | cut -c1-180); fi
            echo "error_line=$ERROR_LINE" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Upload playtest metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rogue-defense-v0.1-rc1-playtest-metrics
          path: test-results/rc-perf.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish soak status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SOAK_EXIT: ${{ steps.soak.outputs.exit_code }}
          SOAK_ERROR: ${{ steps.soak.outputs.error_line }}
          PERF_LINE: ${{ steps.soak.outputs.perf_line }}
        run: |
          if [ "$SOAK_EXIT" = "0" ]; then
            STATE=success
            DESC="Accelerated W1-W101 soak + Stress300 passed"
            if [ -n "$PERF_LINE" ]; then DESC=$(printf 'Soak passed; perf %s' "$PERF_LINE" | cut -c1-140); fi
          else
            STATE=failure
            DESC="RC soak or Stress300 baseline failed"
          fi
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"ci/soak\",\"description\":\"$DESC\"}"
          if [ "$SOAK_EXIT" != "0" ] && [ -n "$SOAK_ERROR" ]; then
            SAFE=$(printf '%s' "$SOAK_ERROR" | sed 's/[^A-Za-z0-9_.:()\/ -]/_/g' | cut -c1-180)
            curl --fail-with-body -sS -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/statuses/$SHA" \
              -d "{\"state\":\"failure\",\"context\":\"ci/soak-error: $SAFE\",\"description\":\"RC soak failure summary\"}"
          fi
      - name: Fail workflow when soak failed
        if: steps.soak.outputs.exit_code != '0'
        run: exit 1
