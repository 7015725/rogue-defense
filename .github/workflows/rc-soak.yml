name: RC Soak

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: rc-soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - name: Publish soak pending status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d '{"state":"pending","context":"ci/soak","description":"RC checkpoint functional + Stress300 queued"}'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@1.62.1
          npx playwright install --with-deps chromium

      - name: RC checkpoint + Stress300 suite
        id: suite
        shell: bash
        run: |
          set +e
          npm run soak 2>&1 | tee soak.log
          SUITE_EXIT=${PIPESTATUS[0]}
          echo "suite_exit=$SUITE_EXIT" >> "$GITHUB_OUTPUT"

          FUNCTIONAL_OK=1
          if grep -q '^RC_FUNCTIONAL PASS$' soak.log; then FUNCTIONAL_OK=0; fi
          echo "functional_exit=$FUNCTIONAL_OK" >> "$GITHUB_OUTPUT"

          PERF_LINE=$(grep '^RC_PERF ' soak.log | tail -n 1 | sed 's/^RC_PERF //' | tr -d '\r\n' | cut -c1-180)
          if [ -n "$PERF_LINE" ]; then echo "perf_line=$PERF_LINE" >> "$GITHUB_OUTPUT"; fi

          PERF_EXIT=1
          if [ -n "$PERF_LINE" ]; then
            PERF_EXIT=$(node -e 'const m=JSON.parse(process.argv[1]); process.stdout.write((m.W1>=15 && m.W50>=15 && m.W100>=15) ? "0" : "1")' "$PERF_LINE")
          fi
          echo "perf_exit=$PERF_EXIT" >> "$GITHUB_OUTPUT"

          if [ "$SUITE_EXIT" -ne 0 ]; then
            ERROR_LINE=$(grep -E 'Error:|Expected:|Received:|Timeout|Boss Shop|pageerror:|console:' soak.log | head -n 1 | tr -d '\r\n' | cut -c1-180)
            if [ -z "$ERROR_LINE" ]; then ERROR_LINE=$(tail -n 3 soak.log | tr '\n' ' ' | tr -d '\r' | cut -c1-180); fi
            echo "error_line=$ERROR_LINE" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload playtest metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rogue-defense-v0.1-rc1-playtest-metrics
          path: test-results/rc-perf.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish soak results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SUITE_EXIT: ${{ steps.suite.outputs.suite_exit }}
          FUNCTIONAL_EXIT: ${{ steps.suite.outputs.functional_exit }}
          PERF_EXIT: ${{ steps.suite.outputs.perf_exit }}
          PERF_LINE: ${{ steps.suite.outputs.perf_line }}
          SUITE_ERROR: ${{ steps.suite.outputs.error_line }}
        run: |
          publish_status() {
            local state="$1"
            local context="$2"
            local description="$3"
            curl --fail-with-body -sS -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/statuses/$SHA" \
              -d "{\"state\":\"$state\",\"context\":\"$context\",\"description\":\"$description\"}"
          }

          if [ "$FUNCTIONAL_EXIT" = "0" ]; then
            publish_status success "ci/soak-functional" "W10-W100 checkpoint chain + W101 unlock passed"
          else
            publish_status failure "ci/soak-functional" "Checkpoint functional soak failed"
          fi

          METRIC_CONTEXT=""
          if [ -n "$PERF_LINE" ]; then
            METRIC_CONTEXT=$(printf '%s' "$PERF_LINE" | sed 's/[{}\"]//g; s/:/=/g; s/,/ /g' | cut -c1-100)
          fi

          if [ "$PERF_EXIT" = "0" ]; then
            publish_status success "ci/perf" "Stress300 W1/W50/W100 all >= 15 FPS"
            if [ -n "$METRIC_CONTEXT" ]; then publish_status success "ci/perf-metrics $METRIC_CONTEXT" "Measured Stress300 requestAnimationFrame FPS"; fi
          else
            publish_status failure "ci/perf" "Stress300 FPS threshold or measurement failed"
            if [ -n "$METRIC_CONTEXT" ]; then publish_status failure "ci/perf-metrics $METRIC_CONTEXT" "Measured Stress300 requestAnimationFrame FPS"; fi
          fi

          if [ "$SUITE_EXIT" = "0" ] && [ "$FUNCTIONAL_EXIT" = "0" ] && [ "$PERF_EXIT" = "0" ]; then
            publish_status success "ci/soak" "RC checkpoint functional + Stress300 passed"
          else
            publish_status failure "ci/soak" "RC soak validation failed"
          fi

          if [ -n "$SUITE_ERROR" ]; then
            SAFE=$(printf '%s' "$SUITE_ERROR" | sed 's/[^A-Za-z0-9_.:()\/ -]/_/g' | cut -c1-180)
            publish_status failure "ci/soak-error: $SAFE" "RC soak failure summary"
          fi

      - name: Fail workflow when soak failed
        if: steps.suite.outputs.suite_exit != '0' || steps.suite.outputs.functional_exit != '0' || steps.suite.outputs.perf_exit != '0'
        run: exit 1
