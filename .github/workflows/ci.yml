name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Build
        id: build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [ "$EXIT_CODE" -ne 0 ]; then
            ERROR_LINE=$(grep -E 'error TS[0-9]+:|error during build|Error:' build.log | tail -n 1 | tr -d '\r\n' | cut -c1-180)
            if [ -z "$ERROR_LINE" ]; then ERROR_LINE=$(tail -n 1 build.log | tr -d '\r\n' | cut -c1-180); fi
            echo "error_line=$ERROR_LINE" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Publish commit status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BUILD_EXIT: ${{ steps.build.outputs.exit_code }}
          ERROR_LINE: ${{ steps.build.outputs.error_line }}
        run: |
          if [ "$BUILD_EXIT" = "0" ]; then STATE=success; else STATE=failure; fi
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"ci/build\",\"description\":\"Rogue Defense TypeScript + Vite build\"}"
          if [ "$BUILD_EXIT" != "0" ] && [ -n "$ERROR_LINE" ]; then
            SAFE=$(printf '%s' "$ERROR_LINE" | sed 's/[^A-Za-z0-9_.:()\/ -]/_/g' | cut -c1-180)
            curl --fail-with-body -sS -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/statuses/$SHA" \
              -d "{\"state\":\"failure\",\"context\":\"ci/error: $SAFE\",\"description\":\"Latest build error summary\"}"
          fi
      - name: Fail job when build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
